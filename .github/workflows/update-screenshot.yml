name: Update screenshot

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:          # adds a "Run workflow" button to run it any time

permissions:
  contents: write
  pages: write

env:
  # Your published Google Site address
  SITE_URL: https://sites.google.com/view/133rdacademyblet/home

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Take screenshot
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1920, height: 1080 } });
            await page.goto(process.env.SITE_URL, { waitUntil: 'load', timeout: 60000 });
            await page.waitForTimeout(5000); // let images and embeds finish loading
            await page.screenshot({ path: 'screenshot.png' });
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Save screenshot if the site changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshot.png
          if git diff --cached --quiet; then
            echo "Site looks the same, nothing to update."
            exit 0
          fi
          git commit -m "Update site screenshot"
          git push
          # Ask GitHub Pages to republish with the new screenshot
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
